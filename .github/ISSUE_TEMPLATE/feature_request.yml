name: Feature request
description: Suggest an improvement to setup, backups or maintenance.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the effect on existing scripts and user settings.
    validations:
      required: true
