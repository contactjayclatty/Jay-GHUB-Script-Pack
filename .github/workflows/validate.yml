name: Validate installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test isolated install and uninstall
        run: python test_installer.py
      - name: Check README and documentation
        run: python check_docs.py
      - name: Build installer
        shell: powershell
        run: .\build.ps1
      - name: Scan exact executable and extracted payload with Microsoft Defender
        shell: powershell
        run: .\scan-release.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: dist/*
